<!DOCTYPE html>
<html>
<head>
  <title>Live Clipboard</title>
  <style>
    body { margin: 0; }
    
    /* Standardgröße für Mobilgeräte (wie das iPhone) */
    textarea { 
      width: 100vw; 
      height: 100vh; 
      border: none; 
      outline: none; 
      font-size: 32px; 
      padding: 15px; 
      box-sizing: border-box; 
    }
    
    /* Automatische Anpassung für größere Bildschirme (wie Laptops ab 768px Breite) */
    @media (min-width: 768px) {
      textarea {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <textarea id="pad" placeholder="Schreibe etwas..."></textarea>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD1Q4wL-j9Q35ENs_1Yfq7Br9M7N479qqM",
      authDomain: "clipboard-online-a221d.firebaseapp.com",
      databaseURL: "https://clipboard-online-a221d-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "clipboard-online-a221d",
      storageBucket: "clipboard-online-a221d.firebasestorage.app",
      messagingSenderId: "619728606866",
      appId: "1:619728606866:web:89ed0f209e872f1752f84b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const padId = urlParams.get('pad') || 'default';
    const padRef = ref(db, "pads/" + padId);
    const textarea = document.getElementById("pad");

    let isTyping = false;
    let typingTimer;

    // Live-Update empfangen
    onValue(padRef, (snapshot) => {
      // Nur aktualisieren, wenn wir NICHT gerade selbst aktiv tippen
      if (!isTyping) {
        textarea.value = snapshot.val() || "";
      }
    });

    // In Echtzeit speichern (mit intelligentem Tipp-Timer)
    const saveToFirebase = () => {
      isTyping = true;
      clearTimeout(typingTimer);

      set(padRef, textarea.value)
        .catch((error) => {
          alert("SCHREIB-FEHLER: " + error.message);
        });

      // Nach 1.5 Sekunden Tipp-Pause geben wir den Empfang wieder frei
      typingTimer = setTimeout(() => {
        isTyping = false;
      }, 1500);
    };

    textarea.addEventListener("input", saveToFirebase);
    textarea.addEventListener("keyup", saveToFirebase);
  </script>
</body>
</html>

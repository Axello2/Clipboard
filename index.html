<!DOCTYPE html>
<html>
<head>
  <title>Live Clipboard</title>
  <style>
    body { margin: 0; }
    textarea { width: 100vw; height: 100vh; border: none; outline: none; font-size: 16px; padding: 15px; box-sizing: border-box; }
  </style>
</head>
<body>
  <textarea id="pad" placeholder="Schreibe etwas..."></textarea>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD1Q4wL-j9Q35ENs_1Yfq7Br9M7N479qqM",
      authDomain: "clipboard-online-a221d.firebaseapp.com",
      databaseURL: "https://clipboard-online-a221d-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "clipboard-online-a221d",
      storageBucket: "clipboard-online-a221d.firebasestorage.app",
      messagingSenderId: "619728606866",
      appId: "1:619728606866:web:89ed0f209e872f1752f84b"
    };


    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Holt den Namen des Pads aus der URL (z. B. ?pad=unser-test)
    const urlParams = new URLSearchParams(window.location.search);
    const padId = urlParams.get('pad') || 'default';
    const padRef = ref(db, "pads/" + padId);
    const textarea = document.getElementById("pad");

      // Live-Update empfangen (mit cleverer Fokus-Erkennung)
    onValue(padRef, (snapshot) => {
      if (!document.hasFocus() || document.activeElement !== textarea) {
        textarea.value = snapshot.val() || "";
      }
    });


        // In Echtzeit speichern (für Mobilgeräte und Fehler-Radar optimiert)
    const saveToFirebase = () => {
      set(padRef, textarea.value)
        .then(() => {
          // Erfolgreich gespeichert!
        })
        .catch((error) => {
          alert("SCHREIB-FEHLER: " + error.message);
        });
    };

    textarea.addEventListener("input", saveToFirebase);
    textarea.addEventListener("keyup", saveToFirebase);

  </script>
</body>
</html>

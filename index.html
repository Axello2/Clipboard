<!DOCTYPE html>
<!-- Clipboard Online Live by Al Vogelmann, Version 3.0.1 | 07.09.2026, 09:06:13 Uhr (Berlin, MESZ/UTC+02:00) -->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clipboard Online Live – Version 3.0.1</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; }
    .version-info {
      flex: 0 0 auto;
      padding: 6px 15px;
      color: #777;
      background: #f5f5f5;
      font: 14px/1.4 Arial, sans-serif;
      box-sizing: border-box;
    }
    textarea {
      width: 100%;
      min-height: 0;
      flex: 1 1 auto;
      border: none;
      outline: none;
      font-size: 32px;
      padding: 15px;
      box-sizing: border-box;
      resize: none;
    }
    @media (min-width: 768px) {
      textarea { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="version-info">Clipboard Online Live by Al Vogelmann, Version 3.0.1 – 07.09.2026, 09:06:13 Uhr (Berlin, MESZ/UTC+02:00)</div>
  <textarea id="pad" placeholder="Schreibe etwas..."></textarea>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD1Q4wL-j9Q35ENs_1Yfq7Br9M7N479qqM",
      authDomain: "clipboard-online-a221d.firebaseapp.com",
      databaseURL: "https://clipboard-online-a221d-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "clipboard-online-a221d",
      storageBucket: "clipboard-online-a221d.firebasestorage.app",
      messagingSenderId: "619728606866",
      appId: "1:619728606866:web:89ed0f209e872f1752f84b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const urlParams = new URLSearchParams(window.location.search);
    const padId = urlParams.get('pad') || 'default';
    const padRef = ref(db, "pads/" + padId);
    const textarea = document.getElementById("pad");
    const writerId = crypto.randomUUID?.() || Math.random().toString(36).slice(2);
    let latestLocalVersion = { updatedAt: 0, writerId: "" };
    let saveTimer;

    const compareVersions = (left, right) =>
      left.updatedAt - right.updatedAt || left.writerId.localeCompare(right.writerId);

    const normalizePad = (value) => {
      if (typeof value === "string") {
        return { text: value, updatedAt: 0, writerId: "legacy" };
      }
      return {
        text: value?.text || "",
        updatedAt: Number(value?.updatedAt) || 0,
        writerId: value?.writerId || ""
      };
    };

    onValue(padRef, (snapshot) => {
      if (!snapshot.exists()) {
        textarea.disabled = true;
        textarea.value = "Zutritt verweigert: Dieses Clipboard wurde vom Admin noch nicht freigeschaltet.";
        textarea.style.backgroundColor = "#ffebee";
        return;
      }
      const remotePad = normalizePad(snapshot.val());
      if (compareVersions(remotePad, latestLocalVersion) >= 0) {
        textarea.value = remotePad.text;
        latestLocalVersion = remotePad;
      }
    });

    const saveToFirebase = (text, editedAt) => {
      runTransaction(padRef, (currentValue) => {
        const currentPad = normalizePad(currentValue);
        const editedVersion = { updatedAt: editedAt, writerId };
        if (compareVersions(currentPad, editedVersion) > 0) {
          return;
        }
        return { text, updatedAt: editedAt, writerId };
      }, { applyLocally: true }).catch((error) => {
        alert("SCHREIB-FEHLER: " + error.message);
      });
    };

    textarea.addEventListener("input", () => {
      const text = textarea.value;
      const editedAt = Date.now();
      latestLocalVersion = { updatedAt: editedAt, writerId };
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => saveToFirebase(text, editedAt), 250);
    });
  </script>
</body>
</html>
